<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="stylesheet" href="styles.css">
    <title>اذكار الصباح والمساء</title>
</head>

<body>
    <div class="app-container">
        <label class="switch">
            <input type="checkbox" id="toggle-switch" aria-label="تبديل بين الأذكار الصباحية والمسائية">
            <span class="slider"></span>
        </label>

        <!-- Main Page -->
        <div class="supplication-display">
            <p id="supplication-text">دعاء الصباح الأول</p>


            <div class="controls">
                <button id="first-button" aria-label="الأول"> &#8677;</button>
                <button id="prev-button" aria-label="السابق" disabled>&#8594;</button>
                <span id="counter" dir="ltr" aria-live="polite">1 / 3</span>
                <button id="next-button" aria-label="التالي">&#8592;</button>
                <button id="last-button" aria-label="الأخير">&#8676;</button>
            </div>

        </div>

        <footer>
            <p>&copy; 2025 <a href="https://irbala.github.io/FayAlabri/" target="_blank" rel="noopener">Fay Alabri</a>. All rights
                reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
