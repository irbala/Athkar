<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="أذكار الصباح والمساء: ذكر واحد في كل مرة مع عداد بالضغط.">
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="stylesheet" href="styles.css">
    <title>اذكار الصباح والمساء</title>
</head>

<body>
    <div class="app-container">
        <header>
            <h1 class="visually-hidden">اذكار الصباح والمساء</h1>
            <label class="switch">
                <input type="checkbox" id="toggle-switch" aria-label="تبديل بين الأذكار الصباحية والمسائية">
                <span class="slider"></span>
            </label>
        </header>

        <main>
            <div class="supplication-display">
                <p id="supplication-text" aria-live="polite">اذكار الصباح</p>
            </div>

            <!-- Tap counter -->
            <div class="tally" id="tally" hidden>
                <button type="button" id="count-button" class="count-button">
                    <span id="count-done" class="count-done">0</span>
                    <span id="count-target" class="count-target"></span>
                </button>
                <button type="button" id="reset-button" class="reset-button" hidden>إعادة العد</button>
            </div>

            <div class="controls">
                <button type="button" id="first-button" aria-label="الأول"> &#8677;</button>
                <button type="button" id="prev-button" aria-label="السابق" disabled>&#8594;</button>
                <span id="counter" dir="ltr">1 / 3</span>
                <button type="button" id="next-button" aria-label="التالي">&#8592;</button>
                <button type="button" id="last-button" aria-label="الأخير">&#8676;</button>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 <a href="https://irbala.github.io/FayAlabri/" target="_blank" rel="noopener">Fay Alabri</a>. All rights
                reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
